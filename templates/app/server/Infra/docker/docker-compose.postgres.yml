services:
  server.api:
    image: ${DOCKER_REGISTRY-}api
    build:
      context: .
      dockerfile: Server.Api/Dockerfile
    depends_on:
      server.postgres:
        condition: service_healthy
    ports:
      - 5000:8080
      - 5001:8081
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Database=Host=server.postgres;Port=5432;Database=server;Username=postgres;Password=Password1!
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://server.aspire-dashboard:18889
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc

  server.postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password1!
      POSTGRES_DB: server
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d server"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  server.aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: true
    ports:
      - 18888:18888

volumes:
  postgres-data-dev:
